name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pypi-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version metadata
        shell: bash
        run: |
          VERSION="$(
            python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          pyproject_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init_text = Path("src/apmoe/__init__.py").read_text()
          init_match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if init_match is None:
              raise SystemExit("src/apmoe/__init__.py does not define __version__")
          init_version = init_match.group(1)
          if pyproject_version != init_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={pyproject_version}, "
                  f"src/apmoe/__init__.py={init_version}"
              )
          print(pyproject_version)
          PY
          )"
          echo "Package version: ${VERSION}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "Release tag '${TAG}' does not match package version '${VERSION}'." >&2
              exit 1
            fi
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify wheel import and CLI
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import apmoe; print(apmoe.__version__)"
          apmoe --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apmoe
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
