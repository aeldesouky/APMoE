[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apmoe"
version = "0.1.7"
description = "APMoE: Age Prediction using Mixture of Experts - an inference-only, IoC-based Python framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11, <3.13"
authors = [{ name = "APMoE Contributors" }]
keywords = ["age-prediction", "mixture-of-experts", "deep-learning", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "pydantic>=2.5",
    "PyJWT[crypto]>=2.8",
    "python-multipart>=0.0.22",
    "redis>=5.0",
    "tensorflow>=2.15; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "tensorflow-macos>=2.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.2",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/aeldesouky/APMoE"
Documentation = "https://github.com/aeldesouky/APMoE/tree/main/docs"
Repository = "https://github.com/aeldesouky/APMoE"
Issues = "https://github.com/aeldesouky/APMoE/issues"

[project.optional-dependencies]
# Backward-compatible aliases. The default install now includes runtime
# integrations and bundled demo model artifacts.
serve = []
image = []
onnx = []
tensorflow = []
torch = []
remote = []
security = []
redis = []
models = []
dev = [
    "build>=1.2",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.scripts]
apmoe = "apmoe.cli.main:cli"

[project.entry-points."apmoe.modality_processors"]
image = "apmoe.modality.builtin.image:ImageProcessor"
keystroke = "apmoe.modality.builtin.keystroke:KeystrokeProcessor"

[project.entry-points."apmoe.cleaners"]
image_cleaner = "apmoe.processing.builtin.image_cleaners:ImageCleaner"
keystroke_cleaner = "apmoe.processing.builtin.cleaners:KeystrokeCleaner"
base64_image_cleaner = "apmoe.processing.llm:Base64ImageCleaner"

[project.entry-points."apmoe.anonymizers"]
image_anonymizer = "apmoe.processing.builtin.image_anonymizers:ImageAnonymizer"
keystroke_anonymizer = "apmoe.processing.builtin.anonymizers:KeystrokeAnonymizer"
passthrough_image_anonymizer = "apmoe.processing.llm:PassthroughImageAnonymizer"

[project.entry-points."apmoe.experts"]
face_age_expert = "apmoe.experts.builtin:FaceAgeExpert"
keystroke_age_expert = "apmoe.experts.builtin:KeystrokeAgeExpert"
remote = "apmoe.experts.remote:RemoteExpert"
lmstudio = "apmoe.experts.providers.lmstudio:LMStudioExpert"

[project.entry-points."apmoe.aggregators"]
weighted_average = "apmoe.aggregation.builtin:WeightedAverageAggregator"
confidence_weighted = "apmoe.aggregation.builtin:ConfidenceWeightedAggregator"
median = "apmoe.aggregation.builtin:MedianAggregator"

[tool.hatch.build]
exclude = [
    "/weights/**",
    "/src/apmoe/weights/mobilenet_age_model.pth.zip",
]
artifacts = [
    "src/apmoe/weights/face_age_expert.keras",
    "src/apmoe/weights/keystroke_age_expert.onnx",
    "src/apmoe/weights/keystroke_constants.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apmoe", "remote_executors"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "D", "N", "SIM", "RUF"]
ignore = [
    "D100",  # Missing docstring in public module - handled per-file
    "D104",  # Missing docstring in public package
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Mypy (static type checker)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["apmoe"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/apmoe"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
