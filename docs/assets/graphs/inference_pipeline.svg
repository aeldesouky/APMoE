<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">APMoE inference pipeline</title>
  <desc id="desc">A presentable diagram of the APMoE inference pipeline from request entry through modality processing, expert inference, aggregation, and final response.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .entry { fill: #e8f4ff; stroke: #2563eb; }
      .security { fill: #fff1f2; stroke: #e11d48; }
      .core { fill: #fff7ed; stroke: #f97316; }
      .phase-a { fill: #ecfdf5; stroke: #059669; }
      .phase-b { fill: #fdf2f8; stroke: #db2777; }
      .warn { fill: #fefce8; stroke: #ca8a04; }
      .output { fill: #f8fafc; stroke: #475569; }
      .box { stroke-width: 2; rx: 8; ry: 8; }
      .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #475569; }
      .lane-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #ca8a04; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-warn); }
      .thin { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-warn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ca8a04"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="960"/>

  <text class="title" x="64" y="58">APMoE Inference Pipeline</text>
  <text class="subtitle" x="64" y="86">Request entry, two-phase modality processing, mixture-of-experts inference, aggregation, and response metadata.</text>

  <rect class="lane" x="48" y="122" width="1344" height="148"/>
  <text class="lane-title" x="72" y="154">1. Entry and application bootstrap</text>

  <rect class="box entry" x="76" y="180" width="150" height="58"/>
  <text class="label" x="151" y="204" text-anchor="middle">User / Client</text>
  <text class="small" x="151" y="223" text-anchor="middle">JSON, files, bytes</text>

  <rect class="box entry" x="272" y="164" width="176" height="52"/>
  <text class="label" x="360" y="187" text-anchor="middle">CLI</text>
  <text class="small" x="360" y="205" text-anchor="middle">apmoe predict</text>

  <rect class="box entry" x="272" y="222" width="176" height="52"/>
  <text class="label" x="360" y="245" text-anchor="middle">HTTP API</text>
  <text class="small" x="360" y="263" text-anchor="middle">POST /v1/predict</text>

  <rect class="box security" x="496" y="206" width="190" height="68"/>
  <text class="label" x="591" y="231" text-anchor="middle">Middleware</text>
  <text class="small" x="591" y="250" text-anchor="middle">auth, CORS, rate limit</text>
  <text class="small" x="591" y="267" text-anchor="middle">correlation ID</text>

  <rect class="box core" x="736" y="180" width="214" height="72"/>
  <text class="label" x="843" y="206" text-anchor="middle">APMoEApp</text>
  <text class="small" x="843" y="225" text-anchor="middle">config + registries</text>
  <text class="small" x="843" y="242" text-anchor="middle">loaded expert weights</text>

  <rect class="box core" x="1002" y="180" width="210" height="72"/>
  <text class="label" x="1107" y="206" text-anchor="middle">InferencePipeline</text>
  <text class="small" x="1107" y="225" text-anchor="middle">run_async() or run()</text>
  <text class="small" x="1107" y="242" text-anchor="middle">stateless per request</text>

  <rect class="box core" x="1258" y="180" width="106" height="72"/>
  <text class="label" x="1311" y="208" text-anchor="middle">raw_inputs</text>
  <text class="small" x="1311" y="229" text-anchor="middle">dict[str, Any]</text>

  <path class="arrow" d="M226 209 H272"/>
  <path class="thin" d="M448 190 H736"/>
  <path class="arrow" d="M448 248 H496"/>
  <path class="arrow" d="M686 240 C708 240 712 216 736 216"/>
  <path class="arrow" d="M950 216 H1002"/>
  <path class="arrow" d="M1212 216 H1258"/>

  <rect class="lane" x="48" y="300" width="1344" height="294"/>
  <text class="lane-title" x="72" y="332">2. Phase A - modality processing</text>
  <text class="small" x="72" y="354">One branch per provided, configured modality. In async serving, branches run concurrently before expert inference starts.</text>

  <rect class="box phase-a" x="80" y="392" width="126" height="58"/>
  <text class="label" x="143" y="417" text-anchor="middle">Raw image</text>
  <text class="small" x="143" y="436" text-anchor="middle">bytes or path</text>

  <rect class="box phase-a" x="244" y="382" width="168" height="78"/>
  <text class="label" x="328" y="408" text-anchor="middle">ImageProcessor</text>
  <text class="small" x="328" y="428" text-anchor="middle">validate</text>
  <text class="small" x="328" y="445" text-anchor="middle">preprocess</text>

  <rect class="box phase-a" x="450" y="392" width="130" height="58"/>
  <text class="label" x="515" y="417" text-anchor="middle">Cleaner</text>
  <text class="small" x="515" y="436" text-anchor="middle">normalize</text>

  <rect class="box phase-a" x="618" y="392" width="140" height="58"/>
  <text class="label" x="688" y="417" text-anchor="middle">Anonymizer</text>
  <text class="small" x="688" y="436" text-anchor="middle">privacy-safe</text>

  <rect class="box phase-a" x="796" y="392" width="158" height="58"/>
  <text class="label" x="875" y="417" text-anchor="middle">Optional embedder</text>
  <text class="small" x="875" y="436" text-anchor="middle">if configured</text>

  <rect class="box phase-a" x="80" y="492" width="126" height="58"/>
  <text class="label" x="143" y="517" text-anchor="middle">Keystrokes</text>
  <text class="small" x="143" y="536" text-anchor="middle">JSON / features</text>

  <rect class="box phase-a" x="244" y="482" width="168" height="78"/>
  <text class="label" x="328" y="508" text-anchor="middle">KeystrokeProcessor</text>
  <text class="small" x="328" y="528" text-anchor="middle">validate</text>
  <text class="small" x="328" y="545" text-anchor="middle">preprocess</text>

  <rect class="box phase-a" x="450" y="492" width="130" height="58"/>
  <text class="label" x="515" y="517" text-anchor="middle">Cleaner</text>
  <text class="small" x="515" y="536" text-anchor="middle">fill / sanitize</text>

  <rect class="box phase-a" x="618" y="492" width="140" height="58"/>
  <text class="label" x="688" y="517" text-anchor="middle">Anonymizer</text>
  <text class="small" x="688" y="536" text-anchor="middle">strip PII</text>

  <rect class="box phase-a" x="796" y="492" width="158" height="58"/>
  <text class="label" x="875" y="517" text-anchor="middle">Optional embedder</text>
  <text class="small" x="875" y="536" text-anchor="middle">if configured</text>

  <rect class="box warn" x="1010" y="450" width="158" height="80"/>
  <text class="label" x="1089" y="477" text-anchor="middle">Failed modality</text>
  <text class="small" x="1089" y="497" text-anchor="middle">record error in</text>
  <text class="small" x="1089" y="515" text-anchor="middle">failed_modalities</text>

  <rect class="box phase-a" x="1220" y="426" width="136" height="128"/>
  <text class="label" x="1288" y="464" text-anchor="middle">Processed</text>
  <text class="label" x="1288" y="484" text-anchor="middle">inputs</text>
  <text class="small" x="1288" y="509" text-anchor="middle">dict[str,</text>
  <text class="small" x="1288" y="526" text-anchor="middle">ProcessedInput]</text>

  <path class="arrow" d="M206 421 H244"/>
  <path class="arrow" d="M412 421 H450"/>
  <path class="arrow" d="M580 421 H618"/>
  <path class="arrow" d="M758 421 H796"/>
  <path class="arrow" d="M954 421 C1040 421 1128 421 1220 464"/>
  <path class="arrow" d="M206 521 H244"/>
  <path class="arrow" d="M412 521 H450"/>
  <path class="arrow" d="M580 521 H618"/>
  <path class="arrow" d="M758 521 H796"/>
  <path class="arrow" d="M954 521 C1038 521 1126 521 1220 516"/>
  <path class="dash" d="M412 460 C540 586 880 594 1010 516"/>
  <path class="dash" d="M412 560 C560 618 880 600 1010 516"/>
  <path class="dash" d="M1168 490 H1220"/>

  <rect class="lane" x="48" y="624" width="1344" height="238"/>
  <text class="lane-title" x="72" y="656">3. Phase B - expert inference and consensus</text>

  <rect class="box phase-b" x="78" y="696" width="220" height="72"/>
  <text class="label" x="188" y="722" text-anchor="middle">ExpertRegistry</text>
  <text class="small" x="188" y="742" text-anchor="middle">select runnable experts</text>
  <text class="small" x="188" y="759" text-anchor="middle">by declared_modalities</text>

  <rect class="box phase-b" x="356" y="646" width="178" height="60"/>
  <text class="label" x="445" y="671" text-anchor="middle">FaceAgeExpert</text>
  <text class="small" x="445" y="690" text-anchor="middle">Keras / PyTorch</text>

  <rect class="box phase-b" x="356" y="714" width="178" height="60"/>
  <text class="label" x="445" y="739" text-anchor="middle">KeystrokeAgeExpert</text>
  <text class="small" x="445" y="758" text-anchor="middle">ONNX Runtime</text>

  <rect class="box phase-b" x="356" y="782" width="178" height="60"/>
  <text class="label" x="445" y="807" text-anchor="middle">RemoteExpert</text>
  <text class="small" x="445" y="826" text-anchor="middle">HTTP model endpoint</text>

  <rect class="box warn" x="78" y="786" width="220" height="52"/>
  <text class="label" x="188" y="808" text-anchor="middle">Skipped experts</text>
  <text class="small" x="188" y="827" text-anchor="middle">record unmet modalities</text>

  <rect class="box phase-b" x="612" y="714" width="180" height="72"/>
  <text class="label" x="702" y="740" text-anchor="middle">ExpertOutput list</text>
  <text class="small" x="702" y="760" text-anchor="middle">age, confidence,</text>
  <text class="small" x="702" y="777" text-anchor="middle">inference metadata</text>

  <rect class="box phase-b" x="870" y="714" width="190" height="72"/>
  <text class="label" x="965" y="740" text-anchor="middle">AggregatorStrategy</text>
  <text class="small" x="965" y="760" text-anchor="middle">weighted average,</text>
  <text class="small" x="965" y="777" text-anchor="middle">confidence, or median</text>

  <rect class="box warn" x="1124" y="714" width="204" height="72"/>
  <text class="label" x="1226" y="740" text-anchor="middle">Recommendations</text>
  <text class="small" x="1226" y="760" text-anchor="middle">added when confidence</text>
  <text class="small" x="1226" y="777" text-anchor="middle">is below threshold</text>

  <path class="arrow" d="M298 732 H356"/>
  <path class="arrow" d="M534 676 C580 676 574 732 612 732"/>
  <path class="arrow" d="M534 744 H612"/>
  <path class="arrow" d="M534 812 C580 812 574 768 612 768"/>
  <path class="dash" d="M188 768 V786"/>
  <path class="arrow" d="M792 750 H870"/>
  <path class="arrow" d="M1060 750 H1124"/>
  <path class="dash" d="M298 812 C560 900 1030 842 1124 774"/>

  <rect class="lane" x="48" y="852" width="1344" height="78"/>

  <rect class="box output" x="220" y="868" width="378" height="48"/>
  <text class="label" x="409" y="888" text-anchor="middle">Prediction</text>
  <text class="small" x="409" y="907" text-anchor="middle">predicted_age, confidence, per_expert_outputs, skipped_experts, latency, metadata</text>

  <rect class="box entry" x="760" y="868" width="180" height="48"/>
  <text class="label" x="850" y="888" text-anchor="middle">HTTP response</text>
  <text class="small" x="850" y="907" text-anchor="middle">JSON 200 OK</text>

  <rect class="box entry" x="1002" y="868" width="180" height="48"/>
  <text class="label" x="1092" y="888" text-anchor="middle">CLI stdout</text>
  <text class="small" x="1092" y="907" text-anchor="middle">JSON output</text>

  <path class="arrow" d="M1226 786 C1226 842 680 842 598 892"/>
  <path class="arrow" d="M598 892 H760"/>
  <path class="arrow" d="M598 892 H1002"/>

  <text class="tiny" x="64" y="946">Notes: Phase A supports graceful degradation for modality failures. Expert failures are surfaced as pipeline errors. The final prediction carries audit metadata for explainability.</text>
</svg>
